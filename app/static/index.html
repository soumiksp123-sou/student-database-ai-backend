
<!DOCTYPE html>
<html>
<head>
    <title>Student AI Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        #chatbox {
            height: 400px;
            border: 1px solid #ddd;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fafafa;
        }

        .user {
            text-align: right;
            margin: 10px;
        }

        .bot {
            text-align: left;
            margin: 10px;
        }

        .message {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
        }

        .user .message {
            background: #d9fdd3;
        }

        .bot .message {
            background: #e8e8e8;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Database AI Chatbot</h1>

    <div id="chatbox">

        <div class="bot">
            <span class="message">
                Hello! Ask me something about the student database.
            </span>
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="Ask about a student..."
        >

        <button onclick="askQuestion()">
            Send
        </button>

    </div>

</div>

<script>

async function askQuestion() {

    const input = document.getElementById("question");
    const question = input.value.trim();

    if (!question) {
        return;
    }

    const chatbox = document.getElementById("chatbox");

    chatbox.innerHTML += `
        <div class="user">
            <span class="message">
                ${question}
            </span>
        </div>
    `;

    input.value = "";

    chatbox.innerHTML += `
        <div class="bot" id="loading">
            <span class="message">
                Thinking...
            </span>
        </div>
    `;

    chatbox.scrollTop = chatbox.scrollHeight;

    try {

        const response = await fetch("/chat/", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        document.getElementById("loading").remove();

        if (response.ok) {

            chatbox.innerHTML += `
                <div class="bot">
                    <span class="message">
                        ${data.answer}
                    </span>
                </div>
            `;

        } else {

            chatbox.innerHTML += `
                <div class="bot">
                    <span class="message">
                        Error: ${data.detail}
                    </span>
                </div>
            `;
        }

    } catch (error) {

        document.getElementById("loading").remove();

        chatbox.innerHTML += `
            <div class="bot">
                <span class="message">
                    Could not connect to the backend.
                </span>
            </div>
        `;
    }

    chatbox.scrollTop = chatbox.scrollHeight;
}


document
    .getElementById("question")
    .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
            askQuestion();
        }

    });

</script>

</body>
</html>
